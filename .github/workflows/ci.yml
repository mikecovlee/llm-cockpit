name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: oven/bun:1.4.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install
        run: bun install --frozen-lockfile
      - name: test
        run: bun test
      - name: typecheck
        run: bunx tsc --noEmit
      - name: lint
        run: bunx biome check .
      - name: build
        run: bun run scripts/build.ts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build image (no push)
        run: docker build -t llm-cockpit:ci .
      - name: smoke
        run: |
          docker run -d --name smoke -p 7777:7777 llm-cockpit:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7777/api/health && break; sleep 1; done
          docker logs smoke | grep 'listening'
