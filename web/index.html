<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Cockpit</title>
    <script>
      (() => {
        var stored = null;
        try {
          stored = JSON.parse(localStorage.getItem("llm-cockpit.prefs.v1") || "null");
        } catch (e) {
          stored = null;
        }
        var light = false;
        try {
          light = window.matchMedia("(prefers-color-scheme: light)").matches;
        } catch (e) {}
        var theme =
          stored && (stored.theme === "light" || stored.theme === "dark")
            ? stored.theme
            : light
              ? "light"
              : "dark";
        var lang =
          stored && (stored.lang === "en" || stored.lang === "zh")
            ? stored.lang
            : (navigator.language || "").toLowerCase().indexOf("zh") === 0
              ? "zh"
              : "en";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.lang = lang;
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --bg-soft: #0d1117;
        --panel: #11151c;
        --panel-inset: #161b22;
        --border: #21262d;
        --border-2: #161b22;
        --border-3: #30363d;
        --text: #c9d1d9;
        --text-strong: #e6edf3;
        --muted: #8b949e;
        --muted-2: #6e7681;
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.5);
        --accent-faint: rgba(56, 189, 248, 0.28);
        --ok: #34d399;
        --ok-soft: rgba(52, 211, 153, 0.15);
        --warn: #fbbf24;
        --red: #f87171;
        --red-soft: rgba(248, 113, 113, 0.15);
        --danger-border: rgba(248, 113, 113, 0.4);
        --danger-bg: rgba(248, 113, 113, 0.08);
        --bar-track: #1c2128;
        --bar-grad: linear-gradient(90deg, #a78bfa, #38bdf8);
        --code-bg: #1c2128;
        --user-bubble-bg: #1d2733;
        --user-bubble-border: #2b3a4a;
        --thinking-border: #4b5563;
        --chat-btn: #0e7490;
        --chat-btn-text: #f0fdff;
        --chat-btn-stop: #7f1d1d;
        --hdr-bg: rgba(11, 14, 20, 0.94);
        --hdr-shadow: 0 6px 16px -12px rgba(0, 0, 0, 0.55);
        --logo-grad: linear-gradient(135deg, #0ea5e9, #6366f1 55%, #a78bfa);
        --logo-shadow: 0 3px 12px rgba(56, 189, 248, 0.28);
        --wordmark-grad: linear-gradient(90deg, #38bdf8, #a78bfa);
        --spark-a: #38bdf8;
        --spark-b: #a78bfa;
        --nav-on: #21262d;
        --nav-on-inset: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f6f8fa;
        --bg-soft: #eef2f6;
        --panel: #ffffff;
        --panel-inset: #f1f5f9;
        --border: #d8dee4;
        --border-2: #d0d7de;
        --border-3: #c4cdd5;
        --text: #1f2328;
        --text-strong: #111827;
        --muted: #57606a;
        --muted-2: #6b7480;
        --accent: #0284c7;
        --accent-soft: rgba(2, 132, 199, 0.45);
        --accent-faint: rgba(2, 132, 199, 0.22);
        --ok: #15803d;
        --ok-soft: rgba(21, 128, 61, 0.12);
        --warn: #b45309;
        --red: #cf222e;
        --red-soft: rgba(207, 34, 46, 0.12);
        --danger-border: rgba(207, 34, 46, 0.35);
        --danger-bg: rgba(207, 34, 46, 0.06);
        --bar-track: #e6ebf1;
        --bar-grad: linear-gradient(90deg, #7c3aed, #0284c7);
        --code-bg: #eef2f6;
        --user-bubble-bg: #e8f1fa;
        --user-bubble-border: #c3d8ea;
        --thinking-border: #9aa4b1;
        --chat-btn: #0e7490;
        --chat-btn-text: #f0fdff;
        --chat-btn-stop: #b42318;
        --hdr-bg: rgba(255, 255, 255, 0.94);
        --hdr-shadow: 0 6px 16px -12px rgba(15, 23, 42, 0.25);
        --logo-grad: linear-gradient(135deg, #0ea5e9, #6366f1 55%, #a78bfa);
        --logo-shadow: 0 3px 12px rgba(2, 132, 199, 0.25);
        --wordmark-grad: linear-gradient(90deg, #0284c7, #7c3aed);
        --spark-a: #0284c7;
        --spark-b: #7c3aed;
        --nav-on: #e6ebf1;
        --nav-on-inset: inset 0 1px 0 rgba(255, 255, 255, 0.6);
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        font-size: 14px;
      }
      .wrap {
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px 20px 32px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .view {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .hdr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px 14px;
        margin: 0 -12px 12px;
        gap: 12px;
        flex-wrap: wrap;
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--hdr-bg);
        box-shadow: var(--hdr-shadow);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-2);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.2px;
        color: var(--text-strong);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--logo-grad);
        color: #f0f9ff;
        font-size: 15px;
        box-shadow: var(--logo-shadow);
      }
      .wordmark em {
        font-style: normal;
        background: var(--wordmark-grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hdr-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .meta {
        color: var(--muted);
        font-size: 12.5px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sel {
        background: var(--panel-inset);
        color: var(--text);
        border: 1px solid var(--border-3);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 13px;
        min-width: 0;
        max-width: min(340px, 45vw);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 3px 9px;
        border-radius: 999px;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: var(--panel-inset);
        border: 1px solid var(--border-3);
        border-radius: 8px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1;
        padding: 5px 8px;
        cursor: pointer;
      }
      .icon-btn:hover {
        color: var(--text-strong);
        border-color: var(--accent-soft);
      }
      .badge.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .badge.off {
        background: var(--red-soft);
        color: var(--red);
      }
      .badge.pend {
        background: var(--panel-inset);
        color: var(--muted);
      }
      .banner {
        border: 1px solid var(--danger-border);
        background: var(--danger-bg);
        color: var(--red);
        padding: 10px 14px;
        border-radius: 10px;
        margin-bottom: 14px;
        font-size: 13px;
      }
      .banner code {
        background: var(--panel-inset);
        padding: 2px 6px;
        border-radius: 6px;
      }
      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 14px;
      }
      @media (max-width: 1100px) {
        .grid4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .grid5 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 14px;
        margin-bottom: 14px;
      }
      .gpu-row + .gpu-row {
        margin-top: 12px;
      }
      .spark {
        width: 100%;
        height: 40px;
        margin-top: 8px;
        display: block;
      }
      .spark-empty {
        height: 40px;
        margin-top: 8px;
      }
      .spark-cap {
        color: var(--muted);
        font-size: 10px;
        margin-top: 2px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }
      .spark {
        min-width: 0;
      }
      .chart {
        position: relative;
        width: 100%;
        flex: 1 1 0px;
        min-height: 170px;
        margin-top: 8px;
        overflow: hidden;
      }
      .chart > div {
        position: absolute !important;
        inset: 0 !important;
        width: auto !important;
        height: auto !important;
      }
      .card-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .stats {
        display: flex;
        gap: 18px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .stat-value {
        font-size: 22px;
        font-weight: 650;
        color: var(--text-strong);
        font-variant-numeric: tabular-nums;
      }
      .stat-label {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .big {
        font-size: 30px;
        font-weight: 700;
        color: var(--text-strong);
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 8px;
        border-radius: 999px;
        background: var(--bar-track);
        overflow: hidden;
        margin: 8px 0 4px;
      }
      .bar > div {
        height: 100%;
        border-radius: 999px;
        background: var(--bar-grad);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
      }
      .row > span,
      .row > b {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row > b {
        text-align: right;
      }
      .row b {
        color: var(--text);
        font-weight: 600;
      }
      .empty {
        color: var(--muted-2);
        padding: 48px 0;
        text-align: center;
        grid-column: 1 / -1;
      }
      .nav {
        display: flex;
        gap: 2px;
        margin-left: 10px;
        padding: 3px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .nav button {
        background: transparent;
        border: 0;
        color: var(--muted);
        border-radius: 7px;
        padding: 4px 14px;
        font-size: 12.5px;
        cursor: pointer;
      }
      .nav button.on {
        background: var(--nav-on);
        color: var(--text-strong);
        box-shadow: var(--nav-on-inset);
      }
      .chat {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 480px;
      }
      .chat-msgs {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 8px 12px 14px;
      }
      .bubble {
        max-width: 85%;
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.65;
        word-break: break-word;
      }
      .bubble.user {
        align-self: flex-end;
        background: var(--user-bubble-bg);
        border: 1px solid var(--user-bubble-border);
        border-bottom-right-radius: 4px;
      }
      .bubble.assistant {
        align-self: flex-start;
        background: var(--panel);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .bubble .thinking {
        margin: 0 0 10px;
        padding: 8px 12px;
        border-left: 3px solid var(--thinking-border);
        background: var(--bg-soft);
        color: var(--muted);
        font-size: 12.5px;
        font-style: italic;
        border-radius: 6px;
      }
      .bubble .thinking summary {
        cursor: pointer;
        font-style: normal;
        color: var(--muted-2);
        user-select: none;
      }
      .bubble .thinking pre {
        margin: 8px 0 0;
        white-space: pre-wrap;
      }
      .bubble pre {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        overflow-x: auto;
        font-size: 12.5px;
        line-height: 1.55;
      }
      .bubble table {
        border-collapse: collapse;
        margin: 8px 0;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
      }
      .bubble th,
      .bubble td {
        border: 1px solid var(--border);
        padding: 6px 10px;
        text-align: left;
      }
      .bubble th {
        background: var(--panel-inset);
        color: var(--text);
      }
      .codectl {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin: -12px -12px 10px;
        padding: 5px 12px;
        background: var(--panel-inset);
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
      }
      .codectl button {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
        padding: 0;
      }
      .codectl button:hover {
        color: var(--text-strong);
      }
      .cursor {
        color: var(--accent);
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor {
          animation: none;
        }
      }
      .caption {
        font-size: 11px;
        color: var(--muted);
        margin-top: 8px;
      }
      .bubble code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .bubble :not(pre) > code {
        background: var(--code-bg);
        border-radius: 5px;
        padding: 1px 5px;
        font-size: 12.5px;
      }
      .bubble p:first-child {
        margin-top: 0;
      }
      .bubble p:last-child {
        margin-bottom: 0;
      }
      .chat-input {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-end;
      }
      .chat-input textarea {
        flex: 1 1 0;
        min-width: 120px;
        resize: none;
        background: var(--panel-inset);
        color: var(--text-strong);
        border: 1px solid var(--border-3);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        font-family: inherit;
        min-height: 44px;
        max-height: 160px;
        outline: none;
      }
      .hidden {
        display: none;
      }
      .chat-input textarea:focus {
        border-color: var(--accent-soft);
      }
      /* highlight.js theme subsets (vendored; no CDN, works offline):
         github-dark under html[data-theme="dark"], github-light under html[data-theme="light"] */
      html[data-theme="dark"] .hljs {
        color: #e6edf3;
        background: #161b22;
      }
      html[data-theme="dark"] .hljs-comment,
      html[data-theme="dark"] .hljs-quote {
        color: #8b949e;
      }
      html[data-theme="dark"] .hljs-keyword,
      html[data-theme="dark"] .hljs-selector-tag,
      html[data-theme="dark"] .hljs-type {
        color: #ff7b72;
      }
      html[data-theme="dark"] .hljs-string,
      html[data-theme="dark"] .hljs-regexp,
      html[data-theme="dark"] .hljs-meta .hljs-string {
        color: #a5d6ff;
      }
      html[data-theme="dark"] .hljs-number,
      html[data-theme="dark"] .hljs-literal,
      html[data-theme="dark"] .hljs-variable,
      html[data-theme="dark"] .hljs-template-variable,
      html[data-theme="dark"] .hljs-tag .hljs-attr {
        color: #79c0ff;
      }
      html[data-theme="dark"] .hljs-title,
      html[data-theme="dark"] .hljs.title.function_,
      html[data-theme="dark"] .hljs-section,
      html[data-theme="dark"] .hljs-name {
        color: #d2a8ff;
      }
      html[data-theme="dark"] .hljs-built_in,
      html[data-theme="dark"] .hljs-symbol,
      html[data-theme="dark"] .hljs-bullet {
        color: #ffa657;
      }
      html[data-theme="dark"] .hljs-addition {
        color: #34d399;
        background: rgba(52, 211, 153, 0.1);
      }
      html[data-theme="dark"] .hljs-deletion {
        color: #f87171;
        background: rgba(248, 113, 113, 0.1);
      }
      html[data-theme="light"] .hljs {
        color: #1f2328;
        background: #f1f5f9;
      }
      html[data-theme="light"] .hljs-comment,
      html[data-theme="light"] .hljs-quote {
        color: #6e777d;
      }
      html[data-theme="light"] .hljs-keyword,
      html[data-theme="light"] .hljs-selector-tag,
      html[data-theme="light"] .hljs-type {
        color: #cf222e;
      }
      html[data-theme="light"] .hljs-string,
      html[data-theme="light"] .hljs-regexp,
      html[data-theme="light"] .hljs-meta .hljs-string {
        color: #0a3069;
      }
      html[data-theme="light"] .hljs-number,
      html[data-theme="light"] .hljs-literal,
      html[data-theme="light"] .hljs-variable,
      html[data-theme="light"] .hljs-template-variable,
      html[data-theme="light"] .hljs-tag .hljs-attr {
        color: #0550ae;
      }
      html[data-theme="light"] .hljs-title,
      html[data-theme="light"] .hljs.title.function_,
      html[data-theme="light"] .hljs-section,
      html[data-theme="light"] .hljs-name {
        color: #8250df;
      }
      html[data-theme="light"] .hljs-built_in,
      html[data-theme="light"] .hljs-symbol,
      html[data-theme="light"] .hljs-bullet {
        color: #0550ae;
      }
      html[data-theme="light"] .hljs-addition {
        color: #116329;
        background: rgba(21, 128, 61, 0.1);
      }
      html[data-theme="light"] .hljs-deletion {
        color: #cf222e;
        background: rgba(207, 34, 46, 0.08);
      }
      .chat-input .attach-btn {
        width: 34px;
        align-self: stretch;
        flex: 0 0 auto;
        background: transparent;
        border: 1px solid var(--border-3);
        border-radius: 10px;
        color: var(--muted);
        font-size: 18px;
        cursor: pointer;
      }
      .chat-input .attach-btn:hover {
        color: var(--text-strong);
        border-color: var(--accent-soft);
      }
      .chat-input .thumbs,
      .chat-input .attach-error {
        flex-basis: 100%;
        margin-bottom: 2px;
      }
      .thumbs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .thumb {
        width: 76px;
        height: 76px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid var(--border-3);
      }
      .thumb-wrap {
        position: relative;
        display: inline-block;
      }
      .thumb-x {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--panel-inset);
        border: 1px solid var(--border-3);
        color: var(--muted);
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        padding: 0;
      }
      .thumb-x:hover {
        color: var(--red);
        border-color: var(--red);
      }
      .attach-error {
        color: var(--red);
        font-size: 12px;
      }
      .mini-btn {
        background: var(--panel-inset);
        border: 1px solid var(--border-3);
        border-radius: 8px;
        color: var(--muted);
        font-size: 11px;
        padding: 4px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      .mini-btn:hover {
        color: var(--text-strong);
        border-color: var(--accent-soft);
      }
      .popover {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 12px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px 18px;
      }
      .prow {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .prow.col {
        grid-column: 1 / -1;
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
      }
      .pin {
        width: 110px;
        background: var(--panel-inset);
        border: 1px solid var(--border-3);
        border-radius: 8px;
        color: var(--text-strong);
        padding: 5px 8px;
        font-size: 12px;
      }
      .psys {
        background: var(--panel-inset);
        border: 1px solid var(--border-3);
        border-radius: 8px;
        color: var(--text-strong);
        padding: 8px 10px;
        font-size: 12px;
        font-family: inherit;
        resize: vertical;
      }
      .checks {
        display: flex;
        gap: 10px;
