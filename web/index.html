<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Cockpit</title>    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0b0e14;
        color: #c9d1d9;
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        font-size: 14px;
      }
      .wrap {
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px 20px 32px;
      }
      .hdr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px 14px;
        margin: 0 -12px;
        gap: 12px;
        flex-wrap: wrap;
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(11, 14, 20, 0.88);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #161b22;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.2px;
        color: #e6edf3;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: linear-gradient(135deg, #0ea5e9, #6366f1 55%, #a78bfa);
        color: #f0f9ff;
        font-size: 15px;
        box-shadow: 0 3px 12px rgba(56, 189, 248, 0.28);
      }
      .wordmark em {
        font-style: normal;
        background: linear-gradient(90deg, #38bdf8, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hdr-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .meta {
        color: #8b949e;
        font-size: 12.5px;
      }
      .sel {
        background: #161b22;
        color: #c9d1d9;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 13px;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 3px 9px;
        border-radius: 999px;
      }
      .banner {
        border: 1px solid rgba(248, 113, 113, 0.4);
        background: rgba(248, 113, 113, 0.08);
        color: #f87171;
        padding: 10px 14px;
        border-radius: 10px;
        margin-bottom: 14px;
        font-size: 13px;
      }
      .banner code {
        background: #161b22;
        padding: 2px 6px;
        border-radius: 6px;
      }
      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 14px;
      }
      @media (max-width: 1100px) {
        .grid4 {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .card {
        background: #11151c;
        border: 1px solid #21262d;
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
      }
      .chart {
        width: 100%;
        flex: 1 1 auto;
        min-height: 170px;
        margin-top: 8px;
      }
      .card-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #8b949e;
        margin-bottom: 10px;
      }
      .stats {
        display: flex;
        gap: 18px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .stat-value {
        font-size: 22px;
        font-weight: 650;
        color: #e6edf3;
        font-variant-numeric: tabular-nums;
      }
      .stat-label {
        font-size: 11px;
        color: #6e7681;
        margin-top: 2px;
      }
      .big {
        font-size: 30px;
        font-weight: 700;
        color: #e6edf3;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 8px;
        border-radius: 999px;
        background: #1c2128;
        overflow: hidden;
        margin: 8px 0 4px;
      }
      .bar > div {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #a78bfa, #38bdf8);
      }
      .row {
        display: flex;
        justify-content: space-between;
        font-size: 12.5px;
        color: #8b949e;
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
      }
      .row b {
        color: #c9d1d9;
        font-weight: 600;
      }
      .empty {
        color: #6e7681;
        padding: 48px 0;
        text-align: center;
        grid-column: 1 / -1;
      }
      .nav {
        display: flex;
        gap: 2px;
        margin-left: 10px;
        padding: 3px;
        background: #11151c;
        border: 1px solid #21262d;
        border-radius: 10px;
      }
      .nav button {
        background: transparent;
        border: 0;
        color: #8b949e;
        border-radius: 7px;
        padding: 4px 14px;
        font-size: 12.5px;
        cursor: pointer;
      }
      .nav button.on {
        background: #21262d;
        color: #e6edf3;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .chat {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 96px);
        min-height: 480px;
      }
      .chat-msgs {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 8px 2px 14px;
      }
      .bubble {
        max-width: 85%;
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.65;
        word-break: break-word;
      }
      .bubble.user {
        align-self: flex-end;
        background: #1d2733;
        border: 1px solid #2b3a4a;
        border-bottom-right-radius: 4px;
      }
      .bubble.assistant {
        align-self: flex-start;
        background: #11151c;
        border: 1px solid #21262d;
        border-bottom-left-radius: 4px;
      }
      .bubble .thinking {
        margin: 0 0 10px;
        padding: 8px 12px;
        border-left: 3px solid #4b5563;
        background: #0d1117;
        color: #8b949e;
        font-size: 12.5px;
        font-style: italic;
        border-radius: 6px;
      }
      .bubble .thinking summary {
        cursor: pointer;
        font-style: normal;
        color: #6e7681;
        user-select: none;
      }
      .bubble .thinking pre {
        margin: 8px 0 0;
        white-space: pre-wrap;
      }
      .bubble pre {
        background: #0d1117;
        border: 1px solid #21262d;
        border-radius: 8px;
        padding: 12px;
        overflow-x: auto;
        font-size: 12.5px;
        line-height: 1.55;
      }
      .bubble code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .bubble :not(pre) > code {
        background: #1c2128;
        border-radius: 5px;
        padding: 1px 5px;
        font-size: 12.5px;
      }
      .bubble p:first-child {
        margin-top: 0;
      }
      .bubble p:last-child {
        margin-bottom: 0;
      }
      .chat-input {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-end;
      }
      .chat-input textarea {
        flex: 1 1 0;
        min-width: 120px;
        resize: none;
        background: #161b22;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        font-family: inherit;
        min-height: 44px;
        max-height: 160px;
        outline: none;
      }
      .hidden {
        display: none;
      }
      .chat-input textarea:focus {
        border-color: rgba(56, 189, 248, 0.5);
      }
      /* highlight.js github-dark theme subset (vendored; no CDN, works offline) */
      .hljs {
        color: #e6edf3;
        background: #161b22;
      }
      .hljs-comment,
      .hljs-quote {
        color: #8b949e;
      }
      .hljs-keyword,
      .hljs-selector-tag,
      .hljs-type {
        color: #ff7b72;
      }
      .hljs-string,
      .hljs-regexp,
      .hljs-meta .hljs-string {
        color: #a5d6ff;
      }
      .hljs-number,
      .hljs-literal,
      .hljs-variable,
      .hljs-template-variable,
      .hljs-tag .hljs-attr {
        color: #79c0ff;
      }
      .hljs-title,
      .hljs.title.function_,
      .hljs-section,
      .hljs-name {
        color: #d2a8ff;
      }
      .hljs-built_in,
      .hljs-symbol,
      .hljs-bullet {
        color: #ffa657;
      }
      .hljs-addition {
        color: #34d399;
        background: rgba(52, 211, 153, 0.1);
      }
      .hljs-deletion {
        color: #f87171;
        background: rgba(248, 113, 113, 0.1);
      }
      .chat-input .attach-btn {
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        background: transparent;
        border: 1px solid #30363d;
        border-radius: 10px;
        color: #8b949e;
        font-size: 18px;
        cursor: pointer;
      }
      .chat-input .attach-btn:hover {
        color: #e6edf3;
        border-color: rgba(56, 189, 248, 0.5);
      }
      .chat-input .thumbs,
      .chat-input .attach-error {
        flex-basis: 100%;
        margin-bottom: 2px;
      }
      .thumbs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .thumb {
        width: 76px;
        height: 76px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #30363d;
      }
      .thumb-wrap {
        position: relative;
        display: inline-block;
      }
      .thumb-x {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #161b22;
        border: 1px solid #30363d;
        color: #8b949e;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        padding: 0;
      }
      .thumb-x:hover {
        color: #f87171;
        border-color: #f87171;
      }
      .attach-error {
        color: #f87171;
        font-size: 12px;
      }
      .chat-btn {
        background: #0e7490;
        color: #f0fdff;
        border: none;
        border-radius: 10px;
        padding: 11px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .chat-btn.stop {
        background: #7f1d1d;
      }
      .chat-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .chat-hint {
        color: #6e7681;
        font-size: 12px;
        margin-top: 8px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/web/main.js"></script>
  </body>
</html>
