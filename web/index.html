<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>llm-cockpit</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0b0e14;
        color: #c9d1d9;
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        font-size: 14px;
      }
      .wrap {
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px 20px 32px;
      }
      .hdr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0 16px;
        gap: 12px;
        flex-wrap: wrap;
      }
      .brand {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: #e6edf3;
      }
      .logo {
        color: #38bdf8;
      }
      .hdr-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .meta {
        color: #8b949e;
        font-size: 12.5px;
      }
      .sel {
        background: #161b22;
        color: #c9d1d9;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 13px;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 3px 9px;
        border-radius: 999px;
      }
      .banner {
        border: 1px solid rgba(248, 113, 113, 0.4);
        background: rgba(248, 113, 113, 0.08);
        color: #f87171;
        padding: 10px 14px;
        border-radius: 10px;
        margin-bottom: 14px;
        font-size: 13px;
      }
      .banner code {
        background: #161b22;
        padding: 2px 6px;
        border-radius: 6px;
      }
      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 14px;
      }
      @media (max-width: 1100px) {
        .grid4 {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .card {
        background: #11151c;
        border: 1px solid #21262d;
        border-radius: 14px;
        padding: 14px 16px;
      }
      .card-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #8b949e;
        margin-bottom: 10px;
      }
      .stats {
        display: flex;
        gap: 18px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .stat-value {
        font-size: 22px;
        font-weight: 650;
        color: #e6edf3;
        font-variant-numeric: tabular-nums;
      }
      .stat-label {
        font-size: 11px;
        color: #6e7681;
        margin-top: 2px;
      }
      .big {
        font-size: 30px;
        font-weight: 700;
        color: #e6edf3;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 8px;
        border-radius: 999px;
        background: #1c2128;
        overflow: hidden;
        margin: 8px 0 4px;
      }
      .bar > div {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #a78bfa, #38bdf8);
      }
      .row {
        display: flex;
        justify-content: space-between;
        font-size: 12.5px;
        color: #8b949e;
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
      }
      .row b {
        color: #c9d1d9;
        font-weight: 600;
      }
      .empty {
        color: #6e7681;
        padding: 48px 0;
        text-align: center;
        grid-column: 1 / -1;
      }
      .nav {
        display: flex;
        gap: 6px;
        margin-left: 14px;
      }
      .nav button {
        background: #161b22;
        border: 1px solid #30363d;
        color: #8b949e;
        border-radius: 8px;
        padding: 5px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .nav button.on {
        background: rgba(56, 189, 248, 0.12);
        border-color: rgba(56, 189, 248, 0.5);
        color: #38bdf8;
      }
      .chat {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 96px);
        min-height: 480px;
      }
      .chat-msgs {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 8px 2px 14px;
      }
      .bubble {
        max-width: 85%;
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.65;
        word-break: break-word;
      }
      .bubble.user {
        align-self: flex-end;
        background: #1d2733;
        border: 1px solid #2b3a4a;
        border-bottom-right-radius: 4px;
      }
      .bubble.assistant {
        align-self: flex-start;
        background: #11151c;
        border: 1px solid #21262d;
        border-bottom-left-radius: 4px;
      }
      .bubble .thinking {
        margin: 0 0 10px;
        padding: 8px 12px;
        border-left: 3px solid #4b5563;
        background: #0d1117;
        color: #8b949e;
        font-size: 12.5px;
        font-style: italic;
        border-radius: 6px;
      }
      .bubble .thinking summary {
        cursor: pointer;
        font-style: normal;
        color: #6e7681;
        user-select: none;
      }
      .bubble .thinking pre {
        margin: 8px 0 0;
        white-space: pre-wrap;
      }
      .bubble pre {
        background: #0d1117;
        border: 1px solid #21262d;
        border-radius: 8px;
        padding: 12px;
        overflow-x: auto;
        font-size: 12.5px;
        line-height: 1.55;
      }
      .bubble code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .bubble :not(pre) > code {
        background: #1c2128;
        border-radius: 5px;
        padding: 1px 5px;
        font-size: 12.5px;
      }
      .bubble p:first-child {
        margin-top: 0;
      }
      .bubble p:last-child {
        margin-bottom: 0;
      }
      .chat-input {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      .chat-input textarea {
        flex: 1;
        resize: none;
        background: #161b22;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        font-family: inherit;
        min-height: 44px;
        max-height: 160px;
        outline: none;
      }
      .chat-input textarea:focus {
        border-color: rgba(56, 189, 248, 0.5);
      }
      .chat-btn {
        background: #0e7490;
        color: #f0fdff;
        border: none;
        border-radius: 10px;
        padding: 11px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .chat-btn.stop {
        background: #7f1d1d;
      }
      .chat-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .chat-hint {
        color: #6e7681;
        font-size: 12px;
        margin-top: 8px;
        text-align: center;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github-dark.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/web/main.js"></script>
  </body>
</html>
